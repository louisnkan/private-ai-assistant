
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#202123">
<meta name="description" content="A mobile AI chat assistant with native voice responses.">
<link rel="manifest" href="./manifest.json">
<title>AI Chat Assistant</title>

<style>
:root {
  --bg: #202123;
  --panel: #292a2d;
  --user: #2563eb;
  --text: #ececf1;
  --muted: #9b9ca3;
  --border: #3b3c40;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  height: 62px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
}

.logo-icon {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  display: grid;
  place-items: center;
  font-size: 19px;
}

.status {
  color: #65d6a0;
  font-size: 11px;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 22px 15px 25px;
  scroll-behavior: smooth;
  overscroll-behavior: contain;
}

.welcome {
  text-align: center;
  padding: 55px 15px;
}

.welcome-icon {
  font-size: 42px;
  margin-bottom: 15px;
}

.welcome h2 {
  font-size: 23px;
  margin-bottom: 9px;
}

.welcome p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
}

.message {
  display: flex;
  margin-bottom: 19px;
  animation: appear .25s ease;
}

.message.user {
  justify-content: flex-end;
}

.message.ai {
  justify-content: flex-start;
}

.bubble {
  max-width: 85%;
  padding: 13px 15px;
  border-radius: 17px;
  font-size: 14px;
  line-height: 1.65;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user .bubble {
  background: var(--user);
  color: white;
  border-bottom-right-radius: 5px;
}

.ai .bubble {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom-left-radius: 5px;
}

.message-label {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 5px;
}

.input-area {
  flex-shrink: 0;
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--bg);
}

.input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 9px;
  max-width: 750px;
  margin: auto;
  background: var(--panel);
  border: 1px solid #45464b;
  border-radius: 25px;
  padding: 7px 8px 7px 16px;
}

textarea {
  flex: 1;
  min-width: 0;
  max-height: 120px;
  resize: none;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font: inherit;
  font-size: 14px;
  padding: 8px 0;
}

textarea::placeholder {
  color: #888990;
}

.send-btn {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border: none;
  border-radius: 50%;
  background: #3b82f6;
  color: white;
  font-size: 22px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: .2s;
}

.send-btn:active {
  transform: scale(.9);
}

.send-btn:disabled {
  opacity: .4;
}

.bottom-note {
  text-align: center;
  font-size: 10px;
  color: #777980;
  margin-top: 9px;
}

.typing {
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 15px 5px;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">✦</div>
    <span>AI Assistant</span>
  </div>
  <span class="status">● Voice Ready</span>
</header>

<main class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">✦</div>
    <h2>How can I help you?</h2>
    <p>Ask me anything. I'll respond and read my answers aloud using your device's voice.</p>
  </div>
</main>

<footer class="input-area">
  <div class="input-wrapper">
    <textarea
      id="userInput"
      placeholder="Message AI Assistant..."
      rows="1"
      aria-label="Type your message"
    ></textarea>

    <button class="send-btn" id="sendBtn" aria-label="Send message">↑</button>
  </div>
  <div class="bottom-note">AI Assistant · Native device speech synthesis</div>
</footer>

<script>
const chatArea = document.getElementById("chatArea");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const welcome = document.getElementById("welcome");

let voices = [];

function loadVoices() {
  voices = window.speechSynthesis
    ? speechSynthesis.getVoices()
    : [];
}

if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function addMessage(text, sender) {
  const message = document.createElement("div");
  message.className = "message " + sender;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const label = document.createElement("span");
  label.className = "message-label";
  label.textContent = sender === "user" ? "You" : "AI Assistant";

  bubble.appendChild(label);
  bubble.appendChild(document.createTextNode(text));
  message.appendChild(bubble);

  chatArea.appendChild(message);
  chatArea.scrollTop = chatArea.scrollHeight;

  return message;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    return;
  }

  // Cancel previous speech before speaking the new response.
  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  const englishVoice = voices.find(voice =>
    voice.lang.toLowerCase().startsWith("en")
  );

  if (englishVoice) {
    utterance.voice = englishVoice;
  }

  speechSynthesis.speak(utterance);
}

function generateResponse(message) {
  const text = message.toLowerCase();

  if (text.includes("hello") || text.includes("hi")) {
    return "Hello! It's great to have you here. What would you like us to explore today?";
  }

  if (text.includes("who are you")) {
    return "I'm your AI Chat Assistant. I can help you brainstorm ideas, explain concepts, answer questions and explore solutions.";
  }

  if (text.includes("how are you")) {
    return "I'm functioning perfectly and ready to help. How is your day going?";
  }

  if (text.includes("thank")) {
    return "You're very welcome! I'm glad I could help.";
  }

  if (text.includes("javascript")) {
    return "JavaScript is a programming language used to make websites interactive. It can also power mobile applications, web applications and backend services.";
  }

  return "That's an interesting question! You said: " + message +
    "\n\nI'm currently running in demo mode. My responses are generated locally using predefined JavaScript logic, rather than a connected AI model.";
}

function showTyping() {
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typing";
  typing.textContent = "AI Assistant is thinking...";
  chatArea.appendChild(typing);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function sendMessage() {
  const message = userInput.value.trim();

  if (!message) return;

  if (welcome) welcome.remove();

  // Stop any previous speech.
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  addMessage(message, "user");

  userInput.value = "";
  userInput.style.height = "auto";

  sendBtn.disabled = true;
  showTyping();

  // Simulate an AI response.
  setTimeout(() => {
    const typing = document.getElementById("typing");
    if (typing) typing.remove();

    const response = generateResponse(message);

    const aiMessage = addMessage(response, "ai");

    // Read the response aloud after it appears.
    speak(response);

    chatArea.scrollTop = aiMessage.offsetTop;

    sendBtn.disabled = false;
    userInput.focus();
  }, 900);
}

sendBtn.addEventListener("click", sendMessage);

userInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

userInput.addEventListener("input", () => {
  userInput.style.height = "auto";
  userInput.style.height =
    Math.min(userInput.scrollHeight, 120) + "px";
});

// Register service worker.
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => console.error("Service worker error:", error));
  });
}
</script>

</body>
</html>
